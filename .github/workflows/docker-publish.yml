name: Publicar imagen Docker

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Etiqueta Git que se publicara (por ejemplo, v8.4.10)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
  cancel-in-progress: false

env:
  IMAGE_NAME: jomarpel74/cuadernopro

jobs:
  prepare:
    name: Validar la version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      major_minor: ${{ steps.release.outputs.major_minor }}
      major: ${{ steps.release.outputs.major }}
      revision: ${{ steps.source.outputs.revision }}
    steps:
      - name: Determinar la version
        id: release
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "La etiqueta debe tener el formato vX.Y.Z: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "major_minor=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          echo "major=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - name: Comprobar version y registrar commit
        id: source
        env:
          EXPECTED_VERSION: ${{ steps.release.outputs.version }}
        run: |
          python3 -c 'import os; from core.version import APP_VERSION; assert APP_VERSION == os.environ["EXPECTED_VERSION"], "La version no coincide con el tag"'
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  security:
    name: Validar las dos imagenes
    needs: prepare
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ needs.prepare.outputs.revision }}
      export-images: true

  publish:
    name: Publicar las imagenes comprobadas
    needs: [prepare, security]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: imagen-*
          path: images
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publicar cada arquitectura sin reconstruir
        env:
          EXPECTED_REVISION: ${{ needs.prepare.outputs.revision }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            docker load --input "images/cuadernopro-${arch}.tar"
            image="cuadernopro:security-${arch}"
            test "$(docker image inspect --format '{{.Architecture}}' "$image")" = "$arch"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")" = "$EXPECTED_REVISION"
            test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image")" = "$EXPECTED_VERSION"
            candidate="${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${arch}"
            docker tag "$image" "$candidate"
            docker push "$candidate"
          done
      - name: Actualizar etiquetas publicas tras superar todos los controles
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          MAJOR_MINOR: ${{ needs.prepare.outputs.major_minor }}
          MAJOR: ${{ needs.prepare.outputs.major }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${VERSION}" \
            --tag "${IMAGE_NAME}:${MAJOR_MINOR}" \
            --tag "${IMAGE_NAME}:${MAJOR}" \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-amd64" \
            "${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-arm64"
